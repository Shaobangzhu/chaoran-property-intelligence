name: Release Promotion Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: release-promotion-${{ github.event.pull_request.number }}

jobs:
  classify:
    name: Classify release changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      application_required: ${{ steps.release-changes.outputs.application_required }}
      bootstrap_fallback: ${{ steps.release-changes.outputs.bootstrap_fallback }}
      changed_file_count: ${{ steps.release-changes.outputs.changed_file_count }}
      classification_valid: ${{ steps.release-changes.outputs.classification_valid }}
      documentation_only: ${{ steps.release-changes.outputs.documentation_only }}
      platform_required: ${{ steps.release-changes.outputs.platform_required }}
      unclassified_file_count: ${{ steps.release-changes.outputs.unclassified_file_count }}

    env:
      CPI_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout trusted base classifier with full ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Classify application, platform, and non-deployable changes
        id: release-changes
        run: |-
          if [ ! -f tools/release/classifyReleaseChanges.mjs ]; then
            mkdir -p test-results
            {
              echo "application_required=true"
              echo "bootstrap_fallback=true"
              echo "changed_file_count=0"
              echo "classification_valid=true"
              echo "documentation_only=false"
              echo "platform_required=true"
              echo "unclassified_file_count=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Release Change Classification"
              echo
              echo "Trusted base classifier: not yet installed"
              echo "Bootstrap fallback: conservative application and platform lanes"
              echo
              echo "The candidate classifier was not executed. Exact DEV application evidence and the credential-free Guardrails source-template comparison are both required for this one-time rollout."
            } > test-results/release-change-classification.md
            cat test-results/release-change-classification.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "bootstrap_fallback=false" >> "$GITHUB_OUTPUT"
          set +e
          node tools/release/classifyReleaseChanges.mjs \
            --base "$CPI_RELEASE_BASE_SHA" \
            --head "$CPI_RELEASE_CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file test-results/release-change-classification.md
          classification_status="$?"
          set -e
          cat test-results/release-change-classification.md >> "$GITHUB_STEP_SUMMARY"
          exit "$classification_status"

  no_deployment:
    name: Confirm no deployment required
    needs: classify
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.documentation_only == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CPI_CHANGED_FILE_COUNT: ${{ needs.classify.outputs.changed_file_count }}

    steps:
      - name: Record docs and tests no-deployment decision
        run: |-
          {
            echo "## No deployment required"
            echo
            echo "The trusted release classifier found only documentation and test changes."
            echo
            echo "Changed files: \`$CPI_CHANGED_FILE_COUNT\`"
            echo
            echo "No AWS credentials, DEV release verification, or remote regression was requested."
          } >> "$GITHUB_STEP_SUMMARY"

  application_release:
    name: Verify exact AWS DEV application release
    needs: classify
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.application_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CPI_EXPECTED_DEPLOYMENT_STAGE: dev
      CPI_PLAYWRIGHT_REMOTE_BASE_URL: ${{ vars.CPI_AWS_DEV_BASE_URL }}
      CPI_PLAYWRIGHT_RETRIES: "1"
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_RELEASE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CPI_RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CPI_TESTED_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_TEST_ENVIRONMENT: aws-dev-release

    steps:
      - name: Enforce application dev-to-main release path
        run: |-
          if [ "$CPI_RELEASE_HEAD_REF" != "dev" ]; then
            echo "::error title=Invalid application release source::Application changes must be promoted from the protected dev branch."
            {
              echo "## Application release promotion rejected"
              echo
              echo "The exact DEV application lane accepts only a same-repository \`dev -> main\` pull request."
              echo
              echo "Retarget this application change to \`dev\`. After it is merged and deployed to AWS DEV, open the release pull request from \`dev\` to \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CPI_RELEASE_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Invalid release repository::The protected dev branch must belong to this repository."
            exit 1
          fi

      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact HTTPS DEV target
        run: |-
          test -n "$CPI_PLAYWRIGHT_REMOTE_BASE_URL"
          node -e '
            const target = new URL(process.env.CPI_PLAYWRIGHT_REMOTE_BASE_URL);
            if (
              target.protocol !== "https:" ||
              target.username ||
              target.password ||
              target.pathname !== "/" ||
              target.search ||
              target.hash
            ) {
              throw new Error("CPI_AWS_DEV_BASE_URL must be an HTTPS origin without credentials");
            }
          '

      - name: Record release candidate source identity
        run: |-
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_CANDIDATE_SHA"
          {
            echo "## Exact AWS DEV Release Promotion Evidence"
            echo
            echo "Candidate: \`$CPI_RELEASE_CANDIDATE_SHA\`"
            echo
            echo "Source path: protected \`dev -> main\` application release"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check bounded AWS DEV readiness
        run: >-
          node tools/aws/waitForHttp.mjs
          --url "$CPI_PLAYWRIGHT_REMOTE_BASE_URL/api/health"
          --attempts 6
          --interval-ms 10000
          --request-timeout-ms 5000

      - name: Verify deployed release ancestry and impact
        id: deployed-release
        run: |-
          node tools/release/verifyDeployedRelease.mjs \
            --base-url "$CPI_PLAYWRIGHT_REMOTE_BASE_URL" \
            --candidate-sha "$CPI_RELEASE_CANDIDATE_SHA" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file test-results/deployed-release.md
          cat test-results/deployed-release.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate flaky-test quarantine policy
        run: |-
          mkdir -p test-results/flake-evidence
          node tools/flaky-tests/validateFlakeRegistry.mjs \
            --registry tests/flaky-tests.json \
            --output test-results/flake-evidence/quarantine-policy.md \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browser
        run: pnpm test:e2e:install-browsers

      - name: Run full remote-safe Playwright regression
        id: playwright
        env:
          CPI_APPEND_ALLURE_RESULTS: "true"
        run: |-
          set +e
          pnpm exec playwright test
          test_status="$?"
          set -e
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"

      - name: Analyze retry and quarantine evidence
        id: flake-analysis
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          mkdir -p test-results/flake-evidence
          if [ -f test-results/playwright-results.json ]; then
            set +e
            node tools/flaky-tests/analyzePlaywrightResults.mjs \
              --results test-results/playwright-results.json \
              --registry tests/flaky-tests.json \
              --output-markdown test-results/flake-evidence/retry-analysis.md \
              --output-json test-results/flake-evidence/retry-analysis.json \
              --github-output "$GITHUB_OUTPUT" \
              --fail-on-unexpected
            analysis_status="$?"
            set -e
          else
            analysis_status=1
            printf '%s\n' \
              '## Retry And Flake Analysis' \
              '' \
              'Playwright JSON results were not produced.' \
              > test-results/flake-evidence/retry-analysis.md
          fi
          echo "exit_code=$analysis_status" >> "$GITHUB_OUTPUT"

      - name: Generate Allure report
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          if [ -d allure-results ]; then
            pnpm report:allure
          else
            echo "No Allure results were produced."
          fi

      - name: Upload release diagnostics
        id: release-diagnostics
        if: always() && steps.playwright.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: release-promotion-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            allure-results/
            allure-report/
            playwright-report/
            test-results/deployed-release.md
            test-results/flake-evidence/
            test-results/playwright/
            test-results/playwright-results.json
          retention-days: 30

      - name: Publish release quality summary
        if: always() && steps.playwright.outcome == 'success'
        env:
          CPI_QUALITY_ARTIFACT_URL: ${{ steps.release-diagnostics.outputs.artifact-url }}
        run: |-
          pnpm report:github-summary
          cat test-results/flake-evidence/retry-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact release regression outcome
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          test "${{ steps.playwright.outputs.exit_code || '1' }}" = "0"
          test "${{ steps.flake-analysis.outputs.exit_code || '1' }}" = "0"

  platform_synth:
    name: Synthesize account Guardrails candidate
    needs: classify
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.platform_required == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Enforce same-repository platform source
        run: |-
          if [ "$CPI_RELEASE_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Invalid platform source::Account Guardrails plans accept only same-repository pull requests."
            exit 1
          fi

      - name: Checkout exact platform candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install candidate dependencies without AWS credentials
        run: pnpm install --frozen-lockfile

      - name: Verify platform candidate without AWS credentials
        run: |-
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_CANDIDATE_SHA"
          pnpm exec vitest run \
            infra/aws/test \
            tools/aws \
            tools/flaky-tests \
            tools/quality-gate \
            tools/release
          pnpm --dir infra/aws typecheck
          pnpm --dir infra/aws build

      - name: Synthesize isolated Guardrails cloud assembly
        run: |-
          pnpm --dir infra/aws exec cdk synth \
            ChaoranPropertyIntelligenceGuardrails \
            --app 'node dist/bin/guardrails.js' \
            --ci \
            --exclusively \
            --no-lookups \
            --output "$GITHUB_WORKSPACE/guardrails-candidate-assembly" \
            --quiet

      - name: Verify isolated cloud assembly scope
        run: |-
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("guardrails-candidate-assembly/manifest.json", "utf8"));
            const stacks = Object.entries(manifest.artifacts)
              .filter(([, artifact]) => artifact.type === "aws:cloudformation:stack")
              .map(([id]) => id);
            if (JSON.stringify(stacks) !== JSON.stringify(["ChaoranPropertyIntelligenceGuardrails"])) {
              throw new Error(`Expected one isolated Guardrails stack, received: ${stacks.join(", ")}`);
            }
          '

      - name: Upload isolated Guardrails candidate assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: guardrails-candidate-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-candidate-assembly/
          retention-days: 7

  platform_plan:
    name: Compare Guardrails source templates
    needs:
      - classify
      - platform_synth
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.platform_required == 'true' &&
      needs.platform_synth.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CPI_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout trusted base planning tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install trusted planning dependencies
        run: pnpm install --frozen-lockfile

      - name: Download isolated Guardrails candidate assembly
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guardrails-candidate-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-candidate-assembly

      - name: Validate trusted plan inputs
        run: |-
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_BASE_SHA"
          printf '%s' "$CPI_RELEASE_CANDIDATE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test -n "$RUNNER_TEMP"
          guardrails_base_assembly="$RUNNER_TEMP/guardrails-base-assembly"
          echo "CPI_GUARDRAILS_BASE_ASSEMBLY=$guardrails_base_assembly" >> "$GITHUB_ENV"
          mkdir -p "$guardrails_base_assembly" guardrails-plan
          {
            echo "schema_version=1"
            echo "base_sha=$CPI_RELEASE_BASE_SHA"
            echo "candidate_sha=$CPI_RELEASE_CANDIDATE_SHA"
          } > guardrails-plan/comparison-inputs.txt

      - name: Synthesize trusted base Guardrails template
        run: |-
          pnpm --dir infra/aws build
          guardrails_entrypoint='dist/bin/guardrails.js'
          if [ ! -f infra/aws/dist/bin/guardrails.js ]; then
            guardrails_entrypoint='dist/bin/app.js'
            echo "Trusted base predates the isolated Guardrails entrypoint; using the legacy CDK app with an exclusive stack target."
          fi
          test -f "infra/aws/$guardrails_entrypoint"
          pnpm --dir infra/aws exec cdk synth \
            ChaoranPropertyIntelligenceGuardrails \
            --app "node $guardrails_entrypoint" \
            --ci \
            --exclusively \
            --no-lookups \
            --output "$CPI_GUARDRAILS_BASE_ASSEMBLY" \
            --quiet
          test -f "$CPI_GUARDRAILS_BASE_ASSEMBLY/ChaoranPropertyIntelligenceGuardrails.template.json"

      - name: Capture credential-free Guardrails source-template diff
        run: |-
          set +e
          pnpm --dir infra/aws exec cdk diff \
            ChaoranPropertyIntelligenceGuardrails \
            --app "$GITHUB_WORKSPACE/guardrails-candidate-assembly" \
            --template "$CPI_GUARDRAILS_BASE_ASSEMBLY/ChaoranPropertyIntelligenceGuardrails.template.json" \
            --ci \
            --exclusively \
            --fail \
            --method template \
            --no-lookups \
            --no-color 2>&1 | tee guardrails-plan/cdk-diff.txt
          diff_status="${PIPESTATUS[0]}"
          set -e
          if [ "$diff_status" -gt 1 ]; then
            exit "$diff_status"
          fi

      - name: Reject Guardrails resource deletions
        run: |-
          node tools/aws/classifyCdkDiff.mjs \
            --input guardrails-plan/cdk-diff.txt \
            --output guardrails-plan/cdk-diff-summary.md \
            --title "Release Guardrails source comparison" \
            --fail-on-delete
          cat guardrails-plan/cdk-diff-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create immutable Guardrails source-comparison digest
        run: |-
          source_diff_sha256="$(sha256sum guardrails-plan/cdk-diff.txt | cut -d ' ' -f 1)"
          review_digest="$(printf '%s\n%s\n' "$CPI_RELEASE_CANDIDATE_SHA" "$source_diff_sha256" | sha256sum | cut -d ' ' -f 1)"
          {
            echo "schema_version=1"
            echo "candidate_sha=$CPI_RELEASE_CANDIDATE_SHA"
            echo "source_diff_sha256=$source_diff_sha256"
            echo "review_digest=$review_digest"
          } > guardrails-plan/source-comparison.txt
          {
            echo "# Account Guardrails Source Comparison"
            echo
            echo "Candidate: \`$CPI_RELEASE_CANDIDATE_SHA\`"
            echo
            echo "Source-template diff SHA-256: \`$source_diff_sha256\`"
            echo
            echo "Review digest: \`$review_digest\`"
            echo
            echo "This is credential-free pull-request evidence. It cannot authorize an AWS deployment; run the protected account-backed plan after merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Guardrails source-comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: release-guardrails-source-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-plan/
          retention-days: 30

  release_gate:
    name: Promote exact AWS DEV release
    needs:
      - classify
      - no_deployment
      - application_release
      - platform_synth
      - platform_plan
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CPI_APPLICATION_RELEASE_RESULT: ${{ needs.application_release.result }}
      CPI_APPLICATION_REQUIRED: ${{ needs.classify.outputs.application_required }}
      CPI_BOOTSTRAP_FALLBACK: ${{ needs.classify.outputs.bootstrap_fallback }}
      CPI_CLASSIFICATION_RESULT: ${{ needs.classify.result }}
      CPI_CLASSIFICATION_VALID: ${{ needs.classify.outputs.classification_valid }}
      CPI_DOCUMENTATION_ONLY: ${{ needs.classify.outputs.documentation_only }}
      CPI_NO_DEPLOYMENT_RESULT: ${{ needs.no_deployment.result }}
      CPI_PLATFORM_PLAN_RESULT: ${{ needs.platform_plan.result }}
      CPI_PLATFORM_REQUIRED: ${{ needs.classify.outputs.platform_required }}
      CPI_PLATFORM_SYNTH_RESULT: ${{ needs.platform_synth.result }}

    steps:
      - name: Enforce selected release lane outcomes
        run: |-
          gate_status=0

          require_boolean() {
            output_name="$1"
            output_value="$2"
            if [ "$output_value" != "true" ] && [ "$output_value" != "false" ]; then
              echo "::error title=Invalid release classification::$output_name must be true or false."
              gate_status=1
            fi
          }

          require_result() {
            lane_name="$1"
            expected_result="$2"
            actual_result="$3"
            if [ "$actual_result" != "$expected_result" ]; then
              echo "::error title=Release lane outcome mismatch::$lane_name expected $expected_result but finished $actual_result."
              gate_status=1
            fi
          }

          require_boolean "classification_valid" "$CPI_CLASSIFICATION_VALID"
          require_boolean "application_required" "$CPI_APPLICATION_REQUIRED"
          require_boolean "bootstrap_fallback" "$CPI_BOOTSTRAP_FALLBACK"
          require_boolean "platform_required" "$CPI_PLATFORM_REQUIRED"
          require_boolean "documentation_only" "$CPI_DOCUMENTATION_ONLY"

          if [ "$CPI_CLASSIFICATION_RESULT" != "success" ]; then
            echo "::error title=Release classification failed::Trusted change classification finished $CPI_CLASSIFICATION_RESULT."
            gate_status=1
          fi
          if [ "$CPI_CLASSIFICATION_VALID" != "true" ]; then
            echo "::error title=Release classification rejected::The release candidate does not have a valid fail-closed classification."
            gate_status=1
          fi

          if [ "$CPI_CLASSIFICATION_VALID" = "true" ]; then
            selected_lane_count=0

            if [ "$CPI_APPLICATION_REQUIRED" = "true" ]; then
              selected_lane_count=$((selected_lane_count + 1))
              require_result "Application exact DEV release" "success" "$CPI_APPLICATION_RELEASE_RESULT"
            else
              require_result "Application exact DEV release" "skipped" "$CPI_APPLICATION_RELEASE_RESULT"
            fi

            if [ "$CPI_PLATFORM_REQUIRED" = "true" ]; then
              selected_lane_count=$((selected_lane_count + 1))
              require_result "Guardrails candidate synthesis" "success" "$CPI_PLATFORM_SYNTH_RESULT"
              require_result "Guardrails source-template comparison" "success" "$CPI_PLATFORM_PLAN_RESULT"
            else
              require_result "Guardrails candidate synthesis" "skipped" "$CPI_PLATFORM_SYNTH_RESULT"
              require_result "Guardrails source-template comparison" "skipped" "$CPI_PLATFORM_PLAN_RESULT"
            fi

            if [ "$CPI_DOCUMENTATION_ONLY" = "true" ]; then
              selected_lane_count=$((selected_lane_count + 1))
              require_result "Documentation and tests no-deployment" "success" "$CPI_NO_DEPLOYMENT_RESULT"
            else
              require_result "Documentation and tests no-deployment" "skipped" "$CPI_NO_DEPLOYMENT_RESULT"
            fi

            if [ "$selected_lane_count" -eq 0 ]; then
              echo "::error title=No release lane selected::A valid classification must select at least one release lane."
              gate_status=1
            fi
            if [ "$CPI_DOCUMENTATION_ONLY" = "true" ] && [ "$selected_lane_count" -ne 1 ]; then
              echo "::error title=Conflicting release lanes::The no-deployment lane cannot be combined with an application or platform lane."
              gate_status=1
            fi
          fi

          {
            echo "## Stable release promotion decision"
            echo
            echo "| Concern | Required | Result |"
            echo "| --- | --- | --- |"
            echo "| Trusted classification | $CPI_CLASSIFICATION_VALID | $CPI_CLASSIFICATION_RESULT |"
            echo "| Bootstrap fallback | n/a | $CPI_BOOTSTRAP_FALLBACK |"
            echo "| Application exact DEV release | $CPI_APPLICATION_REQUIRED | $CPI_APPLICATION_RELEASE_RESULT |"
            echo "| Guardrails candidate synthesis | $CPI_PLATFORM_REQUIRED | $CPI_PLATFORM_SYNTH_RESULT |"
            echo "| Guardrails source-template comparison | $CPI_PLATFORM_REQUIRED | $CPI_PLATFORM_PLAN_RESULT |"
            echo "| Documentation/tests no-deployment | $CPI_DOCUMENTATION_ONLY | $CPI_NO_DEPLOYMENT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$gate_status"
