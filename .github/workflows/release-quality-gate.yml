name: Release Promotion Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: release-promotion-${{ github.event.pull_request.number }}

jobs:
  classify:
    name: Classify release changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      application_required: ${{ steps.release-changes.outputs.application_required }}
      changed_file_count: ${{ steps.release-changes.outputs.changed_file_count }}
      classification_valid: ${{ steps.release-changes.outputs.classification_valid }}
      documentation_only: ${{ steps.release-changes.outputs.documentation_only }}
      platform_required: ${{ steps.release-changes.outputs.platform_required }}
      unclassified_file_count: ${{ steps.release-changes.outputs.unclassified_file_count }}

    env:
      CPI_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout trusted base classifier with full ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Classify application, platform, and non-deployable changes
        id: release-changes
        run: |-
          set +e
          node tools/release/classifyReleaseChanges.mjs \
            --base "$CPI_RELEASE_BASE_SHA" \
            --head "$CPI_RELEASE_CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file test-results/release-change-classification.md
          classification_status="$?"
          set -e
          cat test-results/release-change-classification.md >> "$GITHUB_STEP_SUMMARY"
          exit "$classification_status"

  application_release:
    name: Promote exact AWS DEV release
    needs: classify
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.application_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CPI_EXPECTED_DEPLOYMENT_STAGE: dev
      CPI_PLAYWRIGHT_REMOTE_BASE_URL: ${{ vars.CPI_AWS_DEV_BASE_URL }}
      CPI_PLAYWRIGHT_RETRIES: "1"
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_RELEASE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CPI_RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CPI_TESTED_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_TEST_ENVIRONMENT: aws-dev-release

    steps:
      - name: Enforce application dev-to-main release path
        run: |-
          if [ "$CPI_RELEASE_HEAD_REF" != "dev" ]; then
            echo "::error title=Invalid application release source::Application changes must be promoted from the protected dev branch."
            {
              echo "## Application release promotion rejected"
              echo
              echo "The exact DEV application lane accepts only a same-repository \`dev -> main\` pull request."
              echo
              echo "Retarget this application change to \`dev\`. After it is merged and deployed to AWS DEV, open the release pull request from \`dev\` to \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CPI_RELEASE_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Invalid release repository::The protected dev branch must belong to this repository."
            exit 1
          fi

      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact HTTPS DEV target
        run: |-
          test -n "$CPI_PLAYWRIGHT_REMOTE_BASE_URL"
          node -e '
            const target = new URL(process.env.CPI_PLAYWRIGHT_REMOTE_BASE_URL);
            if (
              target.protocol !== "https:" ||
              target.username ||
              target.password ||
              target.pathname !== "/" ||
              target.search ||
              target.hash
            ) {
              throw new Error("CPI_AWS_DEV_BASE_URL must be an HTTPS origin without credentials");
            }
          '

      - name: Record release candidate source identity
        run: |-
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_CANDIDATE_SHA"
          {
            echo "## Exact AWS DEV Release Promotion Evidence"
            echo
            echo "Candidate: \`$CPI_RELEASE_CANDIDATE_SHA\`"
            echo
            echo "Source path: protected \`dev -> main\` application release"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check bounded AWS DEV readiness
        run: >-
          node tools/aws/waitForHttp.mjs
          --url "$CPI_PLAYWRIGHT_REMOTE_BASE_URL/api/health"
          --attempts 6
          --interval-ms 10000
          --request-timeout-ms 5000

      - name: Verify deployed release ancestry and impact
        id: deployed-release
        run: |-
          node tools/release/verifyDeployedRelease.mjs \
            --base-url "$CPI_PLAYWRIGHT_REMOTE_BASE_URL" \
            --candidate-sha "$CPI_RELEASE_CANDIDATE_SHA" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file test-results/deployed-release.md
          cat test-results/deployed-release.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate flaky-test quarantine policy
        run: |-
          mkdir -p test-results/flake-evidence
          node tools/flaky-tests/validateFlakeRegistry.mjs \
            --registry tests/flaky-tests.json \
            --output test-results/flake-evidence/quarantine-policy.md \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browser
        run: pnpm test:e2e:install-browsers

      - name: Run full remote-safe Playwright regression
        id: playwright
        env:
          CPI_APPEND_ALLURE_RESULTS: "true"
        run: |-
          set +e
          pnpm exec playwright test
          test_status="$?"
          set -e
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"

      - name: Analyze retry and quarantine evidence
        id: flake-analysis
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          mkdir -p test-results/flake-evidence
          if [ -f test-results/playwright-results.json ]; then
            set +e
            node tools/flaky-tests/analyzePlaywrightResults.mjs \
              --results test-results/playwright-results.json \
              --registry tests/flaky-tests.json \
              --output-markdown test-results/flake-evidence/retry-analysis.md \
              --output-json test-results/flake-evidence/retry-analysis.json \
              --github-output "$GITHUB_OUTPUT" \
              --fail-on-unexpected
            analysis_status="$?"
            set -e
          else
            analysis_status=1
            printf '%s\n' \
              '## Retry And Flake Analysis' \
              '' \
              'Playwright JSON results were not produced.' \
              > test-results/flake-evidence/retry-analysis.md
          fi
          echo "exit_code=$analysis_status" >> "$GITHUB_OUTPUT"

      - name: Generate Allure report
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          if [ -d allure-results ]; then
            pnpm report:allure
          else
            echo "No Allure results were produced."
          fi

      - name: Upload release diagnostics
        id: release-diagnostics
        if: always() && steps.playwright.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: release-promotion-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            allure-results/
            allure-report/
            playwright-report/
            test-results/deployed-release.md
            test-results/flake-evidence/
            test-results/playwright/
            test-results/playwright-results.json
          retention-days: 30

      - name: Publish release quality summary
        if: always() && steps.playwright.outcome == 'success'
        env:
          CPI_QUALITY_ARTIFACT_URL: ${{ steps.release-diagnostics.outputs.artifact-url }}
        run: |-
          pnpm report:github-summary
          cat test-results/flake-evidence/retry-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact release regression outcome
        if: always() && steps.playwright.outcome == 'success'
        run: |-
          test "${{ steps.playwright.outputs.exit_code || '1' }}" = "0"
          test "${{ steps.flake-analysis.outputs.exit_code || '1' }}" = "0"

  platform_synth:
    name: Synthesize account Guardrails candidate
    needs: classify
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.platform_required == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CPI_RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Enforce same-repository platform source
        run: |-
          if [ "$CPI_RELEASE_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Invalid platform source::Account Guardrails plans accept only same-repository pull requests."
            exit 1
          fi

      - name: Checkout exact platform candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install candidate dependencies without AWS credentials
        run: pnpm install --frozen-lockfile

      - name: Verify platform candidate without AWS credentials
        run: |-
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_CANDIDATE_SHA"
          pnpm exec vitest run \
            infra/aws/test \
            tools/aws \
            tools/flaky-tests \
            tools/quality-gate \
            tools/release
          pnpm --dir infra/aws typecheck
          pnpm --dir infra/aws build

      - name: Synthesize isolated Guardrails cloud assembly
        run: |-
          pnpm --dir infra/aws exec cdk synth \
            ChaoranPropertyIntelligenceGuardrails \
            --app 'node dist/bin/guardrails.js' \
            --ci \
            --exclusively \
            --no-lookups \
            --output "$GITHUB_WORKSPACE/guardrails-candidate-assembly" \
            --quiet

      - name: Verify isolated cloud assembly scope
        run: |-
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("guardrails-candidate-assembly/manifest.json", "utf8"));
            const stacks = Object.entries(manifest.artifacts)
              .filter(([, artifact]) => artifact.type === "aws:cloudformation:stack")
              .map(([id]) => id);
            if (JSON.stringify(stacks) !== JSON.stringify(["ChaoranPropertyIntelligenceGuardrails"])) {
              throw new Error(`Expected one isolated Guardrails stack, received: ${stacks.join(", ")}`);
            }
          '

      - name: Upload isolated Guardrails candidate assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: guardrails-candidate-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-candidate-assembly/
          retention-days: 7

  platform_plan:
    name: Plan account Guardrails changes
    needs:
      - classify
      - platform_synth
    if: >-
      needs.classify.outputs.classification_valid == 'true' &&
      needs.classify.outputs.platform_required == 'true' &&
      needs.platform_synth.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: us-west-2
      CPI_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CPI_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout trusted base planning tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install trusted planning dependencies
        run: pnpm install --frozen-lockfile

      - name: Download isolated Guardrails candidate assembly
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guardrails-candidate-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-candidate-assembly

      - name: Validate trusted plan inputs
        run: |-
          test -n "${{ vars.AWS_ACCOUNT_ID }}"
          test "$(git rev-parse HEAD)" = "$CPI_RELEASE_BASE_SHA"
          printf '%s' "$CPI_RELEASE_CANDIDATE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          mkdir -p guardrails-plan

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cpi-release-guardrails-plan
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cpi-github-deploy

      - name: Verify target AWS account
        run: |-
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Capture template-only account-backed Guardrails diff
        run: |-
          set +e
          pnpm --dir infra/aws exec cdk diff \
            ChaoranPropertyIntelligenceGuardrails \
            --app "$GITHUB_WORKSPACE/guardrails-candidate-assembly" \
            --ci \
            --exclusively \
            --fail \
            --method template \
            --no-color 2>&1 | tee guardrails-plan/cdk-diff.txt
          diff_status="${PIPESTATUS[0]}"
          set -e
          if [ "$diff_status" -gt 1 ]; then
            exit "$diff_status"
          fi

      - name: Reject Guardrails resource deletions
        run: |-
          node tools/aws/classifyCdkDiff.mjs \
            --input guardrails-plan/cdk-diff.txt \
            --output guardrails-plan/cdk-diff-summary.md \
            --title "Release Guardrails plan" \
            --fail-on-delete
          cat guardrails-plan/cdk-diff-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create immutable Guardrails plan digest
        id: approval
        run: |-
          node tools/aws/createDeploymentApproval.mjs \
            --commit "$CPI_RELEASE_CANDIDATE_SHA" \
            --diff guardrails-plan/cdk-diff.txt \
            --stage account-guardrails \
            --output guardrails-plan/approval.json \
            --github-output "$GITHUB_OUTPUT" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Guardrails promotion plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: release-guardrails-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardrails-plan/
          retention-days: 30
