name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a reviewed plan or deploy that exact plan
        required: true
        type: choice
        options:
          - plan
          - deploy
      confirmation:
        description: Type plan-production or deploy-production
        required: true
        type: string
      approved_plan_digest:
        description: Approval digest from the matching plan run; required for deploy
        required: false
        type: string
      migration_confirmation:
        description: Type authorize-production-api-migration for deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: production-deployment

env:
  AWS_REGION: us-west-2
  CPI_ALERT_EMAIL: ${{ secrets.CPI_ALERT_EMAIL }}
  CPI_APPROVED_PLAN_DIGEST: ${{ inputs.approved_plan_digest }}
  CPI_MONTHLY_BUDGET_USD: ${{ vars.CPI_MONTHLY_BUDGET_USD || '20' }}
  CPI_PRICE_ESTIMATION_BUDGET_APPROVED: ${{ vars.CPI_PRODUCTION_PRICE_ESTIMATION_BUDGET_APPROVED || 'false' }}
  CPI_PRICE_ESTIMATION_OPENAI_ENABLED: ${{ vars.CPI_PRODUCTION_PRICE_ESTIMATION_OPENAI_ENABLED || 'false' }}
  CPI_PRICE_ESTIMATION_RUNTIME_ENABLED: ${{ vars.CPI_PRODUCTION_PRICE_ESTIMATION_RUNTIME_ENABLED || 'false' }}
  CPI_PRODUCTION_OPERATION: ${{ inputs.operation }}

jobs:
  production:
    name: Plan or deploy production with reviewed migration boundary
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'plan' && inputs.confirmation == 'plan-production') ||
       (inputs.operation == 'deploy' && inputs.confirmation == 'deploy-production' &&
        inputs.migration_confirmation == 'authorize-production-api-migration' &&
        inputs.approved_plan_digest != ''))
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    env:
      VITE_ARCGIS_API_KEY: ${{ secrets.CPI_PRODUCTION_ARCGIS_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout immutable main release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate bounded production configuration
        run: |-
          test -n "${{ vars.AWS_ACCOUNT_ID }}"
          test -n "$CPI_ALERT_EMAIL"
          test -n "$CPI_MONTHLY_BUDGET_USD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/aws/validatePriceEstimationRuntime.mjs \
            --runtime-enabled "$CPI_PRICE_ESTIMATION_RUNTIME_ENABLED" \
            --openai-enabled "$CPI_PRICE_ESTIMATION_OPENAI_ENABLED" \
            --budget-approved "$CPI_PRICE_ESTIMATION_BUDGET_APPROVED"
          if [ "$CPI_PRODUCTION_OPERATION" = "deploy" ]; then
            printf '%s' "$CPI_APPROVED_PLAN_DIGEST" | grep -Eq '^[a-f0-9]{64}$'
          fi

      - name: Run complete deterministic test suite
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm test:e2e:install-browsers

      - name: Run local API and UI smoke
        env:
          CPI_APPEND_ALLURE_RESULTS: "true"
          CPI_PLAYWRIGHT_START_WEB: "true"
        run: pnpm exec playwright test --grep @smoke

      - name: Typecheck
        run: pnpm typecheck

      - name: Build immutable production candidate
        run: |-
          pnpm build
          node tools/release/verifyArcgisWebBuild.mjs \
            --dist apps/web/dist
          node tools/release/createReleaseManifest.mjs \
            --sha "$GITHUB_SHA" \
            --stage production \
            --output apps/web/dist/release.json

      - name: Synthesize production stacks
        run: >-
          pnpm --dir infra/aws exec cdk synth
          --app 'node dist/bin/app.js'
          -c releaseSha="$GITHUB_SHA"
          -c priceEstimationRuntimeEnabled="$CPI_PRICE_ESTIMATION_RUNTIME_ENABLED"
          -c priceEstimationOpenAiEnabled="$CPI_PRICE_ESTIMATION_OPENAI_ENABLED"
          -c scheduleEnabled=false
          -c showingListScheduleEnabled=false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cpi-github-production-${{ inputs.operation }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cpi-github-deploy

      - name: Verify target AWS account
        run: |-
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Capture account-backed production CDK diff
        run: |-
          mkdir -p deployment-plan
          set +e
          pnpm --dir infra/aws exec cdk diff \
            ChaoranPropertyIntelligenceGuardrails \
            ChaoranPropertyIntelligenceProduction \
            ChaoranPropertyIntelligenceProductionEdge \
            ChaoranPropertyIntelligenceProductionPublicApplication \
            -c releaseSha="$GITHUB_SHA" \
            -c priceEstimationRuntimeEnabled="$CPI_PRICE_ESTIMATION_RUNTIME_ENABLED" \
            -c priceEstimationOpenAiEnabled="$CPI_PRICE_ESTIMATION_OPENAI_ENABLED" \
            -c scheduleEnabled=false \
            -c showingListScheduleEnabled=false \
            -c showingListScheduleWeekday=MON \
            -c showingListScheduleHour=8 \
            -c showingListScheduleMinute=0 \
            -c showingListScheduleTimeZone=America/Los_Angeles \
            --ci \
            --fail \
            --method template \
            --no-color 2>&1 | tee deployment-plan/cdk-diff.txt
          diff_status="${PIPESTATUS[0]}"
          set -e
          if [ "$diff_status" -gt 1 ]; then
            exit "$diff_status"
          fi

      - name: Classify CREATE UPDATE REPLACE DELETE
        run: |-
          node tools/aws/classifyCdkDiff.mjs \
            --input deployment-plan/cdk-diff.txt \
            --output deployment-plan/cdk-diff-summary.md \
            --title Production \
            --fail-on-delete
          cat deployment-plan/cdk-diff-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or verify immutable plan approval
        id: approval
        run: |-
          if [ "$CPI_PRODUCTION_OPERATION" = "plan" ]; then
            node tools/aws/createDeploymentApproval.mjs \
              --commit "$GITHUB_SHA" \
              --diff deployment-plan/cdk-diff.txt \
              --stage production \
              --output deployment-plan/approval.json \
              --github-output "$GITHUB_OUTPUT" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            node tools/aws/createDeploymentApproval.mjs \
              --commit "$GITHUB_SHA" \
              --diff deployment-plan/cdk-diff.txt \
              --stage production \
              --output deployment-plan/approval.json \
              --expected-digest "$CPI_APPROVED_PLAN_DIGEST" \
              --github-output "$GITHUB_OUTPUT" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production deployment plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: production-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-plan/
          retention-days: 90

      - name: Capture pre-deployment rollback evidence
        if: inputs.operation == 'deploy'
        run: |-
          mkdir -p deployment-evidence
          jq -n \
            --arg approval_digest "${{ steps.approval.outputs.approval_digest }}" \
            --arg commit "$GITHUB_SHA" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{approvalDigest: $approval_digest, commit: $commit, environment: "production", runUrl: $run_url}' \
            > deployment-evidence/release.json
          find apps/web/dist -type f -print0 | sort -z | \
            xargs -0 sha256sum > deployment-evidence/web-sha256.txt
          if aws cloudformation describe-stacks \
            --stack-name ChaoranPropertyIntelligenceProductionPublicApplication \
            --query 'Stacks[0].Outputs' --output json \
            > deployment-evidence/pre-deploy-outputs.json 2>/dev/null; then
            web_bucket="$(jq -r '.[] | select(.OutputKey == "WebBucketName") | .OutputValue' deployment-evidence/pre-deploy-outputs.json)"
            if [ -n "$web_bucket" ]; then
              aws s3api list-object-versions \
                --bucket "$web_bucket" \
                --max-items 1000 \
                --query '{Versions:Versions[].{Key:Key,VersionId:VersionId,IsLatest:IsLatest,LastModified:LastModified}}' \
                --output json > deployment-evidence/pre-deploy-web-versions.json
            fi
            service_arn="$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='cpi-api'].ServiceArn | [0]" --output text)"
            if [ "$service_arn" != "None" ]; then
              aws apprunner describe-service \
                --service-arn "$service_arn" \
                --query '{ServiceName:Service.ServiceName,Status:Service.Status,ImageIdentifier:Service.SourceConfiguration.ImageRepository.ImageIdentifier}' \
                --output json > deployment-evidence/pre-deploy-api.json
            fi
          else
            printf '%s\n' '{"status":"not-yet-deployed"}' \
              > deployment-evidence/pre-deploy-outputs.json
          fi

      - name: Deploy approved production stacks with schedules disabled
        if: inputs.operation == 'deploy'
        run: |-
          pnpm --dir infra/aws exec cdk deploy \
            ChaoranPropertyIntelligenceGuardrails \
            ChaoranPropertyIntelligenceProduction \
            ChaoranPropertyIntelligenceProductionEdge \
            ChaoranPropertyIntelligenceProductionPublicApplication \
            -c releaseSha="$GITHUB_SHA" \
            -c priceEstimationRuntimeEnabled="$CPI_PRICE_ESTIMATION_RUNTIME_ENABLED" \
            -c priceEstimationOpenAiEnabled="$CPI_PRICE_ESTIMATION_OPENAI_ENABLED" \
            -c scheduleEnabled=false \
            -c showingListScheduleEnabled=false \
            -c showingListScheduleWeekday=MON \
            -c showingListScheduleHour=8 \
            -c showingListScheduleMinute=0 \
            -c showingListScheduleTimeZone=America/Los_Angeles \
            --concurrency 1 \
            --outputs-file "$GITHUB_WORKSPACE/deployment-evidence/cdk-outputs.json" \
            --require-approval never \
            --parameters ChaoranPropertyIntelligenceGuardrails:AlertEmail="$CPI_ALERT_EMAIL" \
            --parameters ChaoranPropertyIntelligenceGuardrails:MonthlyBudgetUsd="$CPI_MONTHLY_BUDGET_USD" \
            --parameters ChaoranPropertyIntelligenceProduction:AlertEmail="$CPI_ALERT_EMAIL" \
            --parameters ChaoranPropertyIntelligenceProductionPublicApplication:DeploymentFailureAlertEmail="$CPI_ALERT_EMAIL"

      - name: Publish immutable production web build
        id: runtime
        if: inputs.operation == 'deploy'
        run: |-
          outputs=deployment-evidence/cdk-outputs.json
          application_url="$(jq -r '.ChaoranPropertyIntelligenceProductionPublicApplication.ApplicationUrl' "$outputs")"
          distribution_id="$(jq -r '.ChaoranPropertyIntelligenceProductionPublicApplication.DistributionId' "$outputs")"
          web_bucket="$(jq -r '.ChaoranPropertyIntelligenceProductionPublicApplication.WebBucketName' "$outputs")"
          test "$application_url" != "null"
          test "$distribution_id" != "null"
          test "$web_bucket" != "null"
          aws s3 sync apps/web/dist/ "s3://$web_bucket/" \
            --delete --only-show-errors
          aws s3 cp apps/web/dist/release.json "s3://$web_bucket/release.json" \
            --cache-control no-store \
            --content-type application/json \
            --only-show-errors
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths '/*' \
            --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$distribution_id" \
            --id "$invalidation_id"
          echo "application_url=$application_url" >> "$GITHUB_OUTPUT"
          echo "CPI_PLAYWRIGHT_REMOTE_BASE_URL=$application_url" >> "$GITHUB_ENV"
          echo "CPI_EXPECTED_RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CPI_EXPECTED_DEPLOYMENT_STAGE=production" >> "$GITHUB_ENV"

      - name: Wait for bounded production health readiness
        if: inputs.operation == 'deploy'
        run: >-
          node tools/aws/waitForHttp.mjs
          --url "$CPI_PLAYWRIGHT_REMOTE_BASE_URL/api/health"
          --attempts 60
          --interval-ms 5000
          --request-timeout-ms 5000

      - name: Run safe read-only production smoke only
        if: inputs.operation == 'deploy'
        env:
          CPI_APPEND_ALLURE_RESULTS: "true"
        run: pnpm exec playwright test --grep @smoke

      - name: Capture post-deployment evidence
        if: always() && inputs.operation == 'deploy'
        run: |-
          if [ -f deployment-evidence/cdk-outputs.json ]; then
            web_bucket="$(jq -r '.ChaoranPropertyIntelligenceProductionPublicApplication.WebBucketName // empty' deployment-evidence/cdk-outputs.json)"
            if [ -n "$web_bucket" ]; then
              aws s3api list-object-versions \
                --bucket "$web_bucket" \
                --max-items 1000 \
                --query '{Versions:Versions[].{Key:Key,VersionId:VersionId,IsLatest:IsLatest,LastModified:LastModified}}' \
                --output json > deployment-evidence/post-deploy-web-versions.json
            fi
          fi
          service_arn="$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='cpi-api'].ServiceArn | [0]" --output text 2>/dev/null || true)"
          if [ -n "$service_arn" ] && [ "$service_arn" != "None" ]; then
            aws apprunner describe-service \
              --service-arn "$service_arn" \
              --query '{ServiceName:Service.ServiceName,Status:Service.Status,ImageIdentifier:Service.SourceConfiguration.ImageRepository.ImageIdentifier,EgressType:Service.NetworkConfiguration.EgressConfiguration.EgressType,VpcConnectorArn:Service.NetworkConfiguration.EgressConfiguration.VpcConnectorArn,RuntimeSecretNames:Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentSecrets[].Name}' \
              --output json > deployment-evidence/post-deploy-api.json
            if [ "$CPI_PRICE_ESTIMATION_RUNTIME_ENABLED" = "true" ]; then
              jq -e '.RuntimeSecretNames | index("RENTCAST_API_KEY") != null' \
                deployment-evidence/post-deploy-api.json >/dev/null
            else
              jq -e '.RuntimeSecretNames | index("RENTCAST_API_KEY") == null' \
                deployment-evidence/post-deploy-api.json >/dev/null
            fi
            if [ "$CPI_PRICE_ESTIMATION_OPENAI_ENABLED" = "true" ]; then
              jq -e '.RuntimeSecretNames | index("OPENAI_API_KEY") != null' \
                deployment-evidence/post-deploy-api.json >/dev/null
            else
              jq -e '.RuntimeSecretNames | index("OPENAI_API_KEY") == null' \
                deployment-evidence/post-deploy-api.json >/dev/null
            fi
          fi

      - name: Generate Allure report
        if: always()
        run: |-
          if [ -d allure-results ]; then
            pnpm report:allure
          else
            echo "No test results were produced."
          fi

      - name: Upload production diagnostics
        id: production-diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: production-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            deployment-evidence/
            allure-results/
            allure-report/
            playwright-report/
            test-results/playwright/
          retention-days: 90

      - name: Publish production quality summary
        if: always()
        env:
          CPI_QUALITY_ARTIFACT_URL: ${{ steps.production-diagnostics.outputs.artifact-url }}
        run: pnpm report:github-summary

      - name: Publish bounded production deployment failure notification
        if: failure() && inputs.operation == 'deploy'
        continue-on-error: true
        run: |-
          topic_arn="$(aws cloudformation describe-stacks \
            --stack-name ChaoranPropertyIntelligenceProductionPublicApplication \
            --query "Stacks[0].Outputs[?OutputKey=='DeploymentFailureTopicArn'].OutputValue | [0]" \
            --output text 2>/dev/null || true)"
          if [ -n "$topic_arn" ] && [ "$topic_arn" != "None" ]; then
            aws sns publish \
              --topic-arn "$topic_arn" \
              --subject "CPI production deployment failed" \
              --message "Production deployment failed for commit $GITHUB_SHA. Review $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
