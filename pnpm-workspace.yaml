packages:
  - "apps/*"
  - "infra/*"
  - "packages/*"

verifyDepsBeforeRun: false
injectWorkspacePackages: true

allowBuilds:
  '@vaadin/vaadin-usage-statistics': false
  argon2: true
  esbuild: true

onlyBuiltDependencies:
  - argon2
  - esbuild

minimumReleaseAgeExclude:
  - aws-cdk-lib@2.266.0
  - aws-cdk@2.1138.0
  - '@aws-sdk/client-s3@3.1115.0'
  - '@aws-sdk/s3-request-presigner@3.1115.0'
